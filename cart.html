x<!DOCTYPE html>
<html>
<head>
    <title>Your Cart - Garg General Store</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔴 NAVBAR -->
<!-- 🔴 NAVBAR -->
<nav class="navbar">

    <!-- LOGO -->
    <div class="logo">Garg General Store</div>

    <!-- MENU ICON (MOBILE) -->
    <div class="menu-icon" onclick="toggleMenu()">☰</div>

    <!-- LINKS -->
    <ul class="nav-links" id="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <!-- RIGHT SIDE -->
    <div class="nav-right">

        <!-- SEARCH -->
        <input type="text" placeholder="Search..." class="search-box">

        <!-- CART ICON -->
        <div class="cart-icon" onclick="toggleCart()">
            🛒 <span id="cart-count">0</span>
        </div>

    </div>

</nav>

<!-- 🛒 CART PAGE -->
<div class="cart-container">

    <!-- LEFT SIDE -->
    <div class="cart-items-box">

        <h2>My Cart</h2>

        <div id="cart-items"></div>

        <!-- COUPON -->
        <div class="coupon-box">
            <input type="text" id="coupon" placeholder="Enter Coupon Code">
            <button onclick="applyCoupon()">Apply</button>
        </div>

        <p id="discount-text" class="coupon-text"></p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="price-box">

        <h3>PRICE DETAILS</h3>

        <div class="price-row">
            <span>Subtotal</span>
            <span>₹<span id="subtotal">0</span></span>
        </div>

        <div class="price-row">
            <span>Delivery</span>
            <span>₹<span id="delivery">0</span></span>
        </div>

        <div class="price-row discount">
            <span>Discount</span>
            <span>-₹<span id="discount">0</span></span>
        </div>

        <hr>

        <div class="price-row total">
            <span>Total Amount</span>
            <span>₹<span id="total">0</span></span>
        </div>

        <button onclick="checkout()" class="place-order">
            PLACE ORDER
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
